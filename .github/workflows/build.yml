name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version lesen
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version in Cargo.toml"
            exit 1
          fi
          patch=${version##*.}
          if (( patch > 99 )); then
            echo "Letzte Stelle darf höchstens 99 sein, danach mittlere Stelle erhöhen (z.B. 0.3.99 → 0.4.0)"
            exit 1
          fi

      - run: cargo test --release
      - run: cargo build --release

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\laermampel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: laermampel-windows
          path: |
            target/release/laermampel.exe
            dist/Laermampel-Setup-*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        # Einmal hing das Hochladen ewig; lieber abbrechen und neu starten.
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Die Update-Funktion lädt nur noch den Installer.
        run: gh release create "$GITHUB_REF_NAME" dist/Laermampel-Setup-*.exe --generate-notes
