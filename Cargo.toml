[package]
name = "laermampel"
version = "0.3.65"
edition = "2024"

[dependencies]
cpal = "0.18"
directories = "6"
# „links“ gehört zu den Standard-Features und muss hier wieder mit rein: sonst wird der Teil,
# der Internetadressen im Browser öffnet, gar nicht mitgebaut und jeder Link tut einfach nichts.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "links", "wayland", "x11"] }
nnnoiseless = { version = "0.5", default-features = false }
ringbuf = "0.4"
rustfft = "6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Echounterdrückung (WebRTC AEC3) in reinem Rust – rechnet heraus, was aus den Kopfhörern
# wieder ins Mikrofon kommt.
sonora = "0.2"
ureq = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
# Liest die Tasten des Headsets direkt über USB-HID. „windows-native“ heißt: reines Rust,
# kein C-Übersetzer im Bau.
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
raw-window-handle = "0.6"
tray-icon = "0.25"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
