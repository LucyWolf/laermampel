[package]
name = "laermampel"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18"
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
